<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Heart Animation</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const CANVAS_WIDTH = 840;
    const CANVAS_HEIGHT = 680;
    const CANVAS_CENTER_X = CANVAS_WIDTH / 2;
    const CANVAS_CENTER_Y = CANVAS_HEIGHT / 2;
    const IMAGE_ENLARGE = 11;
    const HEART_COLOR = "purple";

    function heartFunction(t, shrinkRatio = IMAGE_ENLARGE) {
        let x = 17 * Math.pow(Math.sin(t), 3);
        let y = -(16 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(3 * t));
        x *= shrinkRatio;
        y *= shrinkRatio;
        x += CANVAS_CENTER_X;
        y += CANVAS_CENTER_Y;
        return [Math.floor(x), Math.floor(y)];
    }

    function scatterInside(x, y, beta = 0.15) {
        let ratioX = -beta * Math.log(Math.random());
        let ratioY = -beta * Math.log(Math.random());
        let dx = ratioX * (x - CANVAS_CENTER_X);
        let dy = ratioY * (y - CANVAS_CENTER_Y);
        return [x - dx, y - dy];
    }

    function shrink(x, y, ratio) {
        let force = -1 / Math.pow(Math.pow(x - CANVAS_CENTER_X, 2) + Math.pow(y - CANVAS_CENTER_Y, 2), 0.6);
        let dx = ratio * force * (x - CANVAS_CENTER_X);
        let dy = ratio * force * (y - CANVAS_CENTER_Y);
        return [x - dx, y - dy];
    }

    function curve(p) {
        return 2 * (2 * Math.sin(4 * p)) / (2 * Math.PI);
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getRandomFloat(min, max) {
        return Math.random() * (max - min) + min;
    }

    class Heart {
        constructor(generateFrame = 20) {
            this._points = new Set();
            this._edgeDiffusionPoints = new Set();
            this._centerDiffusionPoints = new Set();
            this.allPoints = {};
            this.generateFrame = generateFrame;

            this.build(2000);

            for (let frame = 0; frame < generateFrame; frame++) {
                this.calc(frame);
            }
        }

        build(number) {
            for (let i = 0; i < number; i++) {
                let t = getRandomFloat(0, 2 * Math.PI);
                let [x, y] = heartFunction(t);
                this._points.add(`${x},${y}`);
            }

            let pointsArray = Array.from(this._points).map(p => p.split(',').map(Number));

            for (let [x, y] of pointsArray) {
                for (let i = 0; i < 3; i++) {
                    let [sx, sy] = scatterInside(x, y, 0.05);
                    this._edgeDiffusionPoints.add(`${sx},${sy}`);
                }
            }

            for (let i = 0; i < 10000; i++) {
                let [x, y] = pointsArray[Math.floor(Math.random() * pointsArray.length)];
                let [sx, sy] = scatterInside(x, y, 0.27);
                this._centerDiffusionPoints.add(`${sx},${sy}`);
            }
        }

        calcPosition(x, y, ratio) {
            let force = 1 / Math.pow(Math.pow(x - CANVAS_CENTER_X, 2) + Math.pow(y - CANVAS_CENTER_Y, 2), 0.420);
            let dx = ratio * force * (x - CANVAS_CENTER_X) + getRandomInt(-1, 1);
            let dy = ratio * force * (y - CANVAS_CENTER_Y) + getRandomInt(-1, 1);
            return [x - dx, y - dy];
        }

        calc(generateFrame) {
            let ratio = 15 * curve((generateFrame / 10) * Math.PI);
            let haloRadius = Math.floor(4 + 6 * (1 + curve((generateFrame / 10) * Math.PI)));
            let haloNumber = Math.floor(3000 + 4000 * Math.abs(Math.pow(curve((generateFrame / 10) * Math.PI), 2)));
            let allPoints = [];

            let heartHaloPoint = new Set();
            for (let i = 0; i < haloNumber; i++) {
                let t = getRandomFloat(0, 2 * Math.PI);
                let [x, y] = heartFunction(t, 15);
                let [sx, sy] = shrink(x, y, haloRadius);
                let key = `${sx},${sy}`;
                
                if (!heartHaloPoint.has(key)) {
                    heartHaloPoint.add(key);
                    sx += getRandomInt(-60, 60);
                    sy += getRandomInt(-60, 60);
                    let size = [1, 1, 2][Math.floor(Math.random() * 3)];
                    allPoints.push([sx, sy, size]);
                }
            }

            let pointsArray = Array.from(this._points).map(p => p.split(',').map(Number));
            for (let [x, y] of pointsArray) {
                let [cx, cy] = this.calcPosition(x, y, ratio);
                let size = getRandomInt(1, 3);
                allPoints.push([cx, cy, size]);
            }

            let edgeArray = Array.from(this._edgeDiffusionPoints).map(p => p.split(',').map(Number));
            for (let [x, y] of edgeArray) {
                let [cx, cy] = this.calcPosition(x, y, ratio);
                let size = getRandomInt(1, 2);
                allPoints.push([cx, cy, size]);
            }

            let centerArray = Array.from(this._centerDiffusionPoints).map(p => p.split(',').map(Number));
            for (let [x, y] of centerArray) {
                let [cx, cy] = this.calcPosition(x, y, ratio);
                let size = getRandomInt(1, 2);
                allPoints.push([cx, cy, size]);
            }

            this.allPoints[generateFrame] = allPoints;
        }

        render(ctx, renderFrame) {
            let frameIndex = renderFrame % this.generateFrame;
            ctx.fillStyle = HEART_COLOR;
            for (let [x, y, size] of this.allPoints[frameIndex]) {
                ctx.fillRect(x, y, size, size);
            }
        }
    }

    // 初始化 Canvas 与 动画循环
    const canvas = document.getElementById('heartCanvas');
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;
    const ctx = canvas.getContext('2d');

    const heart = new Heart();
    let renderFrame = 0;

    function draw() {
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        heart.render(ctx, renderFrame);
        renderFrame++;
        setTimeout(() => {
            requestAnimationFrame(draw);
        }, 90); // 对应 Python 代码里的 30 毫秒延迟
    }

    draw();
</script>

</body>
</html>
